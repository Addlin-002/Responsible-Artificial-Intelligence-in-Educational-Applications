
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | ResponsibleAI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="auth-page">

        <a href="/" class="logo auth-logo">
            <span class="logo-icon">R</span>
            <span>Responsible<span class="logo-highlight">AI</span></span>
        </a>

        <div class="auth-card">

            <div class="auth-heading">
                <span class="section-tag">GET STARTED</span>
                <h1>Create your account</h1>
                <p>Join us in promoting responsible AI in education.</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary auth-submit">
                    Create Account
                </button>

                <p id="registerMessage" class="form-message"></p>

            </form>

            <div class="auth-switch">
                Already have an account?
                <a href="/login">Log in</a>
            </div>

        </div>

        <p class="auth-footer">
            Responsible AI Framework for Educational Applications
        </p>

    </div>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
