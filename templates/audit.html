
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Educational Content | ResponsibleAI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/audit.css') }}">
</head>

<body class="audit-body">

    <header class="dashboard-header">
        <div class="dashboard-logo">ResponsibleAI</div>

        <nav class="dashboard-nav">
            <a href="/dashboard">Dashboard</a>
            <a href="/history">Audit History</a>
            <button class="logout-button" id="logoutButton">Logout</button>
        </nav>
    </header>

    <main class="audit-container">

        <section class="audit-heading">
            <span class="section-tag">AI CONTENT EVALUATION</span>

            <h1>Audit Educational Content</h1>

            <p>
                Evaluate educational material for safety, fairness,
                academic integrity and pedagogical relevance.
            </p>
        </section>

        <section class="audit-form-section">

            <form id="auditForm">

                <div class="form-group">
                    <label for="content">Educational Content</label>

                    <textarea
                        id="content"
                        name="text"
                        placeholder="Paste your educational content here..."
                        maxlength="10000"
                        required
                    ></textarea>

                    <div class="character-count">
                        <span id="charCount">0</span>/10000 characters
                    </div>
                </div>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="contentType">Content Type</label>

                        <select id="contentType" name="content_type">
                            <option value="Study Notes">Study Notes</option>
                            <option value="Assignment">Assignment</option>
                            <option value="AI Generated Explanation">AI Generated Explanation</option>
                            <option value="Quiz">Quiz</option>
                            <option value="Educational Article">Educational Article</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="educationLevel">Education Level</label>

                        <select id="educationLevel" name="education_level">
                            <option value="School">School</option>
                            <option value="Undergraduate" selected>Undergraduate</option>
                            <option value="Postgraduate">Postgraduate</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            placeholder="e.g. Computer Science"
                            value="General"
                        >
                    </div>

                </div>

                <button type="submit" id="analyzeButton">
                    Analyze Educational Content
                </button>

                <p id="auditMessage"></p>

            </form>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/audit.js') }}"></script>

</body>
</html>
