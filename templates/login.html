
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ResponsibleAI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="auth-page">

        <a href="/" class="logo auth-logo">
            <span class="logo-icon">R</span>
            <span>Responsible<span class="logo-highlight">AI</span></span>
        </a>

        <div class="auth-card">

            <div class="auth-heading">
                <span class="section-tag">WELCOME BACK</span>
                <h1>Log in to your account</h1>
                <p>Continue your responsible AI auditing journey.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary auth-submit">
                    Log In
                </button>

                <p id="loginMessage" class="form-message"></p>

            </form>

            <div class="auth-switch">
                Don't have an account?
                <a href="/register">Create an account</a>
            </div>

        </div>

        <p class="auth-footer">
            Responsible AI Framework for Educational Applications
        </p>

    </div>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
